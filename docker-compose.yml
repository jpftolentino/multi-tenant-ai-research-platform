services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: research_platform
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama

  ollama-init:
    image: ollama/ollama
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama server..."
        until ollama list >/dev/null 2>&1; do
          sleep 2
        done

        echo "Pulling llama3 model..."
        ollama pull llama3

        echo "Ollama model initialization complete."

  backend:
    build: ./backend
    ports:
      - "5001:5000"
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgres://app_user:app_password@postgres:5432/research_platform
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_EXPIRES_IN: 1h
      CORS_ORIGIN: http://localhost:5173,http://localhost:5174
    volumes:
      - backend_secrets:/app/.docker-secrets

  worker:
    build: ./worker
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://app_user:app_password@postgres:5432/research_platform
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OLLAMA_BASE_URL: http://ollama:11434

  frontend:
    build: ./frontend
    ports:
      - "5174:5173"
    depends_on:
      - backend

volumes:
  backend_secrets:
  ollama_data: